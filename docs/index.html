  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;

      --muted: #5b6773;
      --line: #d7dde4;
      --accent: #12324a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;

      border: 1px solid var(--line);
      border-radius: 16px;
    }

      margin: 0 0 10px;
      font-size: 1.8rem;
      font-weight: 600;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }
    nav {
      display: grid;
      gap: 12px;
    }
    a {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--accent);
      text-decoration: none;
      background: #fff;
    }
    a:hover,
    a:focus {
      border-color: #9eb0c0;
      background: #fbfcfd;
    }
